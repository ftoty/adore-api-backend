<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina Adorê - Estúdio 3D Criativo</title>
    
    <!-- CDNs Oficiais -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://sdk.mercadopago.com/js/v2"></script>

    <style>
        :root {
            --bg-base: #0f0f11; --bg-surface: #17171a; --bg-card: #202024;
            --accent-green: #C5F955; --accent-pink: #FF97C2;
            --text-main: #fafafa; --text-muted: #94949e; --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Barlow', sans-serif; overflow: hidden; height: 100vh; width: 100vw; display: flex; flex-direction: column; }
        .top-banner { display: flex; align-items: center; justify-content: space-between; height: 56px; background: var(--bg-surface); border-bottom: 1px solid var(--border-color); padding: 0 16px; z-index: 100; flex-shrink: 0; }
        .logo-text { font-size: 16px; font-weight: 800; color: var(--accent-green); cursor: pointer; text-transform: uppercase; }
        .workspace-layout { display: grid; grid-template-columns: 240px 1fr 300px; width: 100%; height: calc(100vh - 56px); }
        .left-sidebar, .right-sidebar { background: var(--bg-surface); padding: 14px; display: flex; flex-direction: column; gap: 14px; }
        .left-sidebar { border-right: 1px solid var(--border-color); }
        .right-sidebar { border-left: 1px solid var(--border-color); }
        .center-canvas { background: var(--bg-base); position: relative; display: flex; align-items: center; justify-content: center; }
        #webgl-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .generate-main-btn { background: linear-gradient(135deg, var(--accent-green), var(--accent-pink)); color: #000; border: none; padding: 12px 28px; font-weight: 700; border-radius: 8px; cursor: pointer; z-index: 10; position: absolute; bottom: 30px; box-shadow: 0 4px 15px rgba(197, 249, 85, 0.3); }
        .krom-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); z-index: 999999; display: flex; align-items: center; justify-content: center; }
        .krom-modal-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; width: 420px; padding: 24px; color: var(--text-main); display: flex; flex-direction: column; gap: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.9); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="top-banner">
        <span class="logo-text">Oficina Adorê</span>
        <div style="display: flex; gap: 12px; align-items: center;">
            <button id="btnOpenAuth" style="background:transparent; border:none; color:var(--accent-green); font-weight:bold; cursor:pointer;">Entrar</button>
            <button id="btnUpgrade" style="background:var(--accent-green); color:#000; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer;">Ativar (R$ 1,00)</button>
            <button onclick="window.location.href='admin/index.html'" style="background:var(--bg-card); color:var(--text-muted); border:1px solid var(--border-color); padding:6px 10px; border-radius:6px; font-weight:bold; cursor:pointer;" title="Painel Administrativo">⚙️ Admin</button>
        </div>
    </header>

    <div class="workspace-layout">
        <aside class="left-sidebar">
            <button onclick="alternarGeometria3D()" style="background:var(--bg-card); color:var(--accent-green); border:1px solid var(--border-color); padding:8px; border-radius:6px; cursor:pointer; font-weight:bold;">Trocar Malha 3D</button>
        </aside>
        
        <main class="center-canvas">
            <div id="webgl-container"></div>
            <button class="generate-main-btn" onclick="executarConversao3D()">✨ Gerar Modelo</button>
        </main>
        
        <aside class="right-sidebar">
            <p style="font-size:11px; color:var(--text-muted); text-transform:uppercase; font-weight:bold;">Ativos Recentes</p>
        </aside>
    </div>

    <!-- Widget do Assistente / Chat -->
    <div id="kromFloatingWidget" style="position: fixed; bottom: 25px; right: 25px; z-index: 99999; display: flex; flex-direction: column; align-items: flex-end;">
        <div id="kromChatWindow" class="hidden" style="width: 360px; height: 480px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
            <div style="background: var(--bg-surface); padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color);">
                <span style="font-size: 13px; font-weight: bold; color: var(--text-main);">Assistente • Oficina Adorê</span>
                <button id="fecharChatKrom" style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px;">✕</button>
            </div>
            <div id="kromChatMessages" style="flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12px;">
                <div style="background: var(--bg-surface); padding: 8px 12px; border-radius: 8px; border-left: 3px solid var(--accent-green); color: var(--text-main);">Olá! Assistente da Oficina Adorê na escuta. Como posso ajudar?</div>
            </div>
            <div style="padding: 10px; background: var(--bg-surface); border-top: 1px solid var(--border-color); display: flex; gap: 6px;">
                <input type="text" id="kromInputText" placeholder="Digite sua dúvida..." style="flex: 1; background: var(--bg-base); color: white; border: 1px solid var(--border-color); border-radius: 6px; padding: 8px; font-size: 12px; outline: none;">
                <button id="kromSendBtn" style="background: var(--accent-green); color: #000; border: none; padding: 0 12px; border-radius: 6px; font-weight: bold; cursor: pointer;">Enviar</button>
            </div>
        </div>
        <div id="kromAvatarToggle" title="Abrir assistente" style="width: 80px; height: 80px; border-radius: 50%; overflow: hidden; border: 3px solid var(--accent-green); box-shadow: 0 5px 25px rgba(0,0,0,0.9); cursor: pointer; background: #111; display: flex; align-items: center; justify-content: center;">
            <video src="assets/krom-animacao.mp4" autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'"></video>
        </div>
    </div>

    <!-- Container Dinâmico Global para Modais -->
    <div id="kromModalContainer"></div>

</body>
